<html>

<head>
  <title>Sample app</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <h1>Register Router</h1>
  <form method="POST" action="/add">
    <input name="ip" placeholder="IP Address" required />
    <input name="username" placeholder="Username" required />
    <input name="password" placeholder="Password" required />
    <button type="submit">Add Router</button>
  </form>

  <ul>
    {% for router in routers %}
    <!-- Inside your existing index.html router loop -->
    <li>
      <a href="/router/{{ router.ip }}">{{ router.ip }}</a> - {{ router.username }}
      <form action="/delete/{{ router._id }}" method="POST" style="display:inline;">
        <button type="submit">Delete</button>
      </form>
    </li>
    {% endfor %}
  </ul>

</body>

</html>
